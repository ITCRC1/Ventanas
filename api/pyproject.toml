[project]
name = "dashboard-ventanas-api"
version = "0.1.0"
description = "API del control financiero del proyecto Ventanas"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # el largo lo maneja ruff format

[tool.ruff.lint.flake8-bugbear]
# Patrón idiomático de FastAPI: Depends/Query/Path en argumentos por defecto.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = []
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["authlib.*", "weasyprint.*", "openpyxl.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
